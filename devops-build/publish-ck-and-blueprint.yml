# Compile + validate on every branch; publish to the shared GitHub catalogs
# on main only (publishToCatalogs gate set in azure-pipelines.yml).
# All steps run in $(OctoToolsCwd) so the tools pick up the job-scoped
# appsettings.json written by install-octo-tools.yml.
steps:
  - task: Bash@3
    displayName: Compile CK model Demo.Tickets
    inputs:
      targetType: inline
      workingDirectory: $(OctoToolsCwd)
      script: |
        set -e
        # -lce false: resolve the System-[2.0,3.0) dependency from the GitHub
        # catalogs, never from local agent state
        octo-ckc -c Compile -p "$(Build.SourcesDirectory)/ck/ConstructionKit" -o "$(Build.SourcesDirectory)/ck/out" -lce false

  - task: Bash@3
    displayName: Validate blueprint OneTimeTicket-1.0.0
    inputs:
      targetType: inline
      workingDirectory: $(OctoToolsCwd)
      script: |
        set -e
        octo-bpm -c validate -p "$(Build.SourcesDirectory)/blueprint/OneTimeTicket/1.0.0"

  # CK model first - the blueprint's ckModelDependencies must resolve at install time
  - task: Bash@3
    displayName: Publish Demo.Tickets to PrivateGitHubCatalog
    condition: and(succeeded(), eq(variables.publishToCatalogs, 'true'))
    inputs:
      targetType: inline
      workingDirectory: $(OctoToolsCwd)
      script: |
        set -e
        # --catalog (not -c): -c is taken by the command selector
        octo-ckc -c Publish -f "$(Build.SourcesDirectory)/ck/out/ck-demo.tickets.yaml" --catalog PrivateGitHubCatalog -r

  - task: Bash@3
    displayName: Publish OneTimeTicket-1.0.0 to PrivateGitHubBlueprintCatalog
    condition: and(succeeded(), eq(variables.publishToCatalogs, 'true'))
    inputs:
      targetType: inline
      workingDirectory: $(OctoToolsCwd)
      script: |
        set -eo pipefail
        # octo-bpm logs publish failures but can still exit 0 - require the
        # success message in the output
        octo-bpm -c publish -p "$(Build.SourcesDirectory)/blueprint/OneTimeTicket/1.0.0" --catalog PrivateGitHubBlueprintCatalog -f | tee bpm-publish.log
        grep -q "published successfully to catalog" bpm-publish.log
