$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
- id: TicketName
  description: Human-readable label of the ticket (e.g. "API key for ACME staging")
  valueType: String

- id: TicketSecret
  description: >-
    The secret delivered on a successful redeem (e.g. an API key). Stored encrypted; write the
    plaintext, reads only report whether it is set. The redeem pipeline reveals it once with
    RevealSecret@1 and clears it (null).
  valueType: Secret
  ownership: Secret

- id: TicketRedeemed
  description: Whether this ticket has already been redeemed. A redeemed ticket never reveals its secret again.
  valueType: Boolean

- id: TicketRedeemedAt
  description: Timestamp of the (single) successful redeem. Unset while the ticket is open.
  valueType: DateTime
