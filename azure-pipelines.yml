# Root-level CI pipeline for one-time-ticket, using the shared templates from
# octo-pipeline-templates + the helm-chart-build companion repo.
#
# Per-channel publishing (CK model and blueprints through the shared
# validate-and-publish steps, AB#5121; routing from update-build-number):
#   main             -> CK model + both blueprints: private catalogs; chart: dev channel
#   r<X.Y.Z> (tag)   -> CK model + both blueprints: private AND public catalogs;
#                       chart: release apps channel
#   every other branch -> validate only, nothing published
# A published CK or blueprint version is never replaced: a content change needs a
# version bump.
#
# This is the repo that ships the app to managed environments: staging/prod read
# the PUBLIC CK catalog + the apps release Helm channel, so only an r* release
# makes the app installable there.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

resources:
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.0.1
    - repository: helmChartBuild
      type: github
      name: meshmakers/helm-chart-build
      endpoint: meshmakers-access-token
      ref: refs/heads/main

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    include:
      - 'r*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}
  - name: appRepository
    value: meshmakers/one-time-ticket-app
  # Platform line the CK compiler and blueprint manager are taken from. Matches the
  # OctoCoreLibVersion this build compiles the CK model against
  # (Directory.Build.props: private feed -> 0.1.*), so the tools understand its
  # schema. Set explicitly: the r* tags carry the app's own version (r1.0.4), so the
  # shared steps would otherwise derive a 1.0.* tool line that does not exist.
  - name: octoToolsVersion
    value: '0.1.*'

stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: 'Build, publish CK model + blueprints, push image, package chart'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
          # Sets $(ChartVersion) — 3-segment SemVer from Build.BuildNumber.
          - template: ci-templates/derive-chart-version.yml@helmChartBuild
          - checkout: self
            clean: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          # Internal CA so dotnet can trust the private NuGet feed's TLS.
          - template: templates/steps/download-ca.yml@pipelineTemplates

          # Restore the current platform packages from the PRIVATE feed. Without
          # /p:OctoNugetPrivateServer the build falls back to public nuget.org and
          # resolves stale packages (the CK compiler version check then fails).
          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: 'OneTimeTicket.sln'
              restoreArguments: '--force /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              noCache: true

          # Compiles the solution, the CK model included, and publishes it nowhere
          # (/p:OctoPublishCkModel=false overrides the csproj, which keeps the flag
          # for local development): the shared CK step below owns publishing. No
          # other CK in this solution depends on Demo.Tickets, so no local catalog
          # is needed. The GitHub API keys keep CkCompile's catalog refresh clear of
          # GitHub's unauthenticated rate limit.
          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: 'OneTimeTicket.sln'
              arguments: >-
                --configuration Release
                /p:OctoNugetPrivateServer=$(nugetPrivateServer)
                /p:OctoPublishCkModel=false
                /p:OctoPrivateGitHubApiKey=$(GitHubPAT)
                /p:OctoPublicGitHubApiKey=$(GitHubPAT)
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false

          # CK model and blueprints: version and schema gate on every build, then
          # main -> private catalogs, r* tags -> private AND public, never replacing
          # a published version; every other branch validates only. Both run after
          # the build, so a run whose build fails has published nothing — a published
          # version cannot be withdrawn. The image and chart steps run after the
          # publish, so their failures do not undo it. The CK step goes first: both
          # blueprints require Demo.Tickets-[1.0.0,2.0.0), so on main the model has
          # to be in the catalog before them.
          - template: templates/steps/validate-and-publish-ck-versions.yml@pipelineTemplates
            parameters:
              constructionKitPaths:
                - 'ck/ConstructionKit'
              toolVersion: '$(octoToolsVersion)'
          - template: templates/steps/validate-and-publish-blueprints.yml@pipelineTemplates
            parameters:
              blueprintPaths:
                - 'blueprint/OneTimeTicket.MainLatest'
                - 'blueprint/OneTimeTicket.Release'
              toolVersion: '$(octoToolsVersion)'

          # App image: multi-arch so it runs on arm64 dev clusters + amd64.
          # Build context is app/ (Dockerfile COPYs server/ + client/ relative to it).
          # Tagged $(Build.BuildNumber) — the same value as the chart appVersion,
          # so the chart's image.tag default resolves to this image.
          - template: templates/steps/build-and-push-docker.yml@pipelineTemplates
            parameters:
              publicRegistryServiceConnection: $(DockerRegistryPublicConnection)
              privateRegistryName: $(DockerRegistryPrivateUri)
              repository: $(appRepository)
              dockerfile: app/Dockerfile
              dockerContext: $(System.DefaultWorkingDirectory)/app
              platforms: 'linux/arm64,linux/amd64'
              enableMainLatestTag: true

          - task: HelmDeploy@0
            displayName: 'helm package one-time-ticket-app'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/charts/one-time-ticket-app'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber)'

          # Dev (rolling) publish — every main build lands in the dev channel.
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: one-time-ticket-app
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/one-time-ticket-app-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))

          # Release publish — only on r* tag, lands in meshmakers.github.io/apps
          # under the app category (the channel staging/prod pull from).
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: app
              chartName: one-time-ticket-app
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/one-time-ticket-app-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))
