# Root-level CI pipeline for one-time-ticket, using the shared templates from
# octo-pipeline-templates@tpl-v0.4.6 + the helm-chart-build companion repo —
# the same shape as octo-mesh-adapter and octo-construction-kit. Replaces the
# hand-rolled devops-build/ flow (manual octo-ckc + local template copies).
#
# Coexists with devops-build/azure-pipelines.yml during the pilot. Once parity
# is verified in a CI run, flip the pipeline definition's yamlFilename to this
# file and delete devops-build/ in a follow-up commit (the octo-construction-kit
# migration approach).
#
# Per-channel publishing (driven by update-build-number's effectivePublishCatalog):
#   dev/*            -> CK model: LocalFileSystemCatalog; blueprint: not published; chart: not published
#   main             -> CK model: PrivateGitHubCatalog;   blueprint: PrivateGitHubBlueprintCatalog; chart: dev channel
#   test/<X.Y>-*     -> CK model: PrivateGitHubCatalog;   blueprint: PrivateGitHubBlueprintCatalog
#   r<X.Y.Z> (tag)   -> CK model: PublicGitHubCatalog;    blueprint: PublicGitHubBlueprintCatalog; chart: release apps channel
#
# This is the repo that ships the app to managed environments: staging/prod read
# the PUBLIC CK catalog + the apps release Helm channel, so only an r* release
# makes the app installable there.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

resources:
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v0.4.6
    - repository: helmChartBuild
      type: github
      name: meshmakers/helm-chart-build
      endpoint: meshmakers-access-token
      ref: refs/heads/main

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    include:
      - 'r*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}
  - name: appRepository
    value: meshmakers/one-time-ticket-app
  # Blueprint catalog target, matching the CK model's effectivePublishCatalog gate
  # exactly (update-build-number: shared catalog only on main + r*, everything else
  # -> local/no-publish). Publishing a blueprint on test/* would push it to the build
  # catalog while its CK dependency only went to a per-run local catalog — an
  # unresolvable state — so test/* (and dev/*, feat/*, PRs) publish nothing.
  - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}:
      - name: blueprintCatalog
        value: PublicGitHubBlueprintCatalog
  - ${{ elseif eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      - name: blueprintCatalog
        value: PrivateGitHubBlueprintCatalog
  - ${{ else }}:
      - name: blueprintCatalog
        value: ''

stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: 'Build CK model, publish blueprints, push image, package chart'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
          # Sets $(ChartVersion) — 3-segment SemVer from Build.BuildNumber.
          - template: ci-templates/derive-chart-version.yml@helmChartBuild
          - checkout: self
            clean: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          # Internal CA so dotnet can trust the private NuGet feed's TLS.
          - template: templates/steps/download-ca.yml@pipelineTemplates

          # Restore the current platform packages from the PRIVATE feed. Without
          # /p:OctoNugetPrivateServer the build falls back to public nuget.org and
          # resolves stale packages (the CK compiler version check then fails).
          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: 'OneTimeTicket.sln'
              restoreArguments: '--force /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              noCache: true

          # CK model: compile + publish to $(effectivePublishCatalog) via MSBuild
          # (no manual octo-ckc). On dev/* this publishes to the per-run local
          # catalog; on main/test -> PrivateGitHubCatalog; on r* -> PublicGitHubCatalog.
          - task: DotNetCoreCLI@2
            displayName: 'Build + publish CK model (dotnet build)'
            inputs:
              command: 'build'
              projects: 'OneTimeTicket.sln'
              arguments: >-
                --configuration Release
                /p:OctoNugetPrivateServer=$(nugetPrivateServer)
                /p:OctoPublishCkModel=true
                /p:OctoPublishCatalog="$(effectivePublishCatalog)"
                /p:OctoPrivateGitHubApiKey=$(GitHubPAT)
                /p:OctoPublicGitHubApiKey=$(GitHubPAT)
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false

          # Blueprint manager (octo-bpm) for validate + publish. octo-ckc is no
          # longer needed — the CK model compiles via dotnet build above.
          - task: Bash@3
            displayName: Install octo-bpm from private feed
            inputs:
              targetType: inline
              script: |
                set -e
                TOOLDIR="$(Agent.TempDirectory)/octo-tools"
                rm -rf "$TOOLDIR"
                dotnet tool install Meshmakers.Octo.BlueprintManager --tool-path "$TOOLDIR" --add-source "$(NugetPrivateServer)" --prerelease
                echo "##vso[task.prependpath]$TOOLDIR"

          - task: Bash@3
            displayName: Validate blueprints (both variants)
            inputs:
              targetType: inline
              script: |
                set -e
                octo-bpm -c validate -p "$(Build.SourcesDirectory)/blueprint/OneTimeTicket.MainLatest"
                octo-bpm -c validate -p "$(Build.SourcesDirectory)/blueprint/OneTimeTicket.Release"

          # Publish both variants to the channel-appropriate blueprint catalog.
          # Gated: skipped on dev/* (blueprintCatalog empty). Writes the octo-bpm
          # settings (PAT) inline and removes them in the same step.
          - task: Bash@3
            displayName: Publish blueprints to $(blueprintCatalog)
            condition: and(succeeded(), ne(variables.blueprintCatalog, ''))
            env:
              GITHUB_PAT: $(GitHubPAT)
            inputs:
              targetType: inline
              script: |
                set -eo pipefail
                mkdir -p ~/.octo-bpm
                cat > ~/.octo-bpm/settings.json <<EOF
                {
                  "PublicOctoGitHub": { "GitHubApiToken": "$GITHUB_PAT" },
                  "PrivateOctoGitHub": { "GitHubApiToken": "$GITHUB_PAT" }
                }
                EOF
                rm -rf ~/.octo/blueprint-catalog/cache
                trap 'rm -f ~/.octo-bpm/settings.json' EXIT
                for bp in OneTimeTicket.MainLatest OneTimeTicket.Release; do
                  octo-bpm -c publish -p "$(Build.SourcesDirectory)/blueprint/$bp" --catalog "$(blueprintCatalog)" -f | tee "bpm-$bp.log"
                  grep -q "published successfully to catalog" "bpm-$bp.log"
                done

          # App image: multi-arch so it runs on arm64 dev clusters + amd64.
          # Build context is app/ (Dockerfile COPYs server/ + client/ relative to it).
          # Tagged $(Build.BuildNumber) — the same value as the chart appVersion,
          # so the chart's image.tag default resolves to this image.
          - template: templates/steps/build-and-push-docker.yml@pipelineTemplates
            parameters:
              publicRegistryServiceConnection: $(DockerRegistryPublicConnection)
              privateRegistryName: $(DockerRegistryPrivateUri)
              repository: $(appRepository)
              dockerfile: app/Dockerfile
              dockerContext: $(System.DefaultWorkingDirectory)/app
              platforms: 'linux/arm64,linux/amd64'
              enableMainLatestTag: true

          - task: HelmDeploy@0
            displayName: 'helm package one-time-ticket-app'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/charts/one-time-ticket-app'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber)'

          # Dev (rolling) publish — every main build lands in the dev channel.
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: one-time-ticket-app
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/one-time-ticket-app-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))

          # Release publish — only on r* tag, lands in meshmakers.github.io/apps
          # under the app category (the channel staging/prod pull from).
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: app
              chartName: one-time-ticket-app
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/one-time-ticket-app-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))
